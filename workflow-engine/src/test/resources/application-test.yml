# 测试环境配置
spring:
  application:
    name: workflow-engine-test
  
  # 内存数据库配置
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    hikari:
      minimum-idle: 1
      maximum-pool-size: 5
      auto-commit: false
      connection-timeout: 5000
      idle-timeout: 10000
      max-lifetime: 30000
      connection-test-query: SELECT 1
  
  # JPA配置
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 10
  
  # Redis配置（使用嵌入式Redis）
  redis:
    host: localhost
    port: 6379
    database: 1
    timeout: 1000ms
    lettuce:
      pool:
        max-active: 2
        max-idle: 2
        min-idle: 0
        max-wait: 100ms

# MyBatis Plus配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    call-setters-on-nulls: true
    jdbc-type-for-null: 'null'
  global-config:
    db-config:
      id-type: ASSIGN_ID
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 日志配置
logging:
  level:
    com.workflow.engine: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# 工作流引擎测试配置
workflow:
  engine:
    executor:
      core-pool-size: 2
      max-pool-size: 5
      queue-capacity: 100
      keep-alive-seconds: 30
    
    task:
      default-timeout: 30000  # 30秒
      max-retries: 1
      retry-backoff-multiplier: 2
      retry-backoff-initial-delay: 500  # 0.5秒
    
    execution:
      max-concurrent-executions: 10
      cleanup-interval: 60000  # 1分钟
      result-ttl: 300000  # 5分钟

# 测试特定的自定义配置
app:
  test:
    enabled: true
    mock-external-services: true